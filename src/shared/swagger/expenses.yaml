tags:
  - name: Expenses
    description: Expense tracking and analytics

paths:
  /expenses:
    post:
      summary: Create a new expense
      tags: [Expenses]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseInput'
      responses:
        "201":
          description: Expense created successfully.
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        "401":
          description: Unauthorized.
    get:
      summary: Get expenses with filtering and pagination
      tags: [Expenses]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: subCategory
          schema:
            type: string
        - in: query
          name: paymentMethod
          schema:
            type: string
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: sort
          schema:
            type: string
            enum: [date_desc, date_asc, amount_desc, amount_asc, category_asc, description_asc]
            default: date_desc
      responses:
        "200":
          description: Expenses retrieved successfully.
        "401":
          description: Unauthorized.

  /expenses/categories:
    get:
      summary: Get available expense categories and subcategories
      tags: [Expenses]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Categories retrieved successfully.
        "401":
          description: Unauthorized.

  /expenses/payment-methods:
    get:
      summary: Get available payment methods
      tags: [Expenses]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Payment methods retrieved successfully.
        "401":
          description: Unauthorized.

  /expenses/analytics/monthly:
    get:
      summary: Get monthly expense analytics
      tags: [Expenses]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: year
          required: true
          schema:
            type: integer
          description: Year (e.g. 2024)
        - in: query
          name: month
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: Month (1–12)
      responses:
        "200":
          description: Monthly analytics retrieved successfully.
        "400":
          description: Missing required parameters.
        "401":
          description: Unauthorized.

  /expenses/analytics/yearly:
    get:
      summary: Get yearly expense analytics
      tags: [Expenses]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: year
          required: true
          schema:
            type: integer
          description: Year (e.g. 2024)
      responses:
        "200":
          description: Yearly analytics retrieved successfully.
        "400":
          description: Missing required parameters.
        "401":
          description: Unauthorized.

  /expenses/dashboard/stats:
    get:
      summary: Get dashboard statistics
      tags: [Expenses]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard stats retrieved successfully.
        "401":
          description: Unauthorized.

  /expenses/{expenseId}:
    get:
      summary: Get expense by ID
      tags: [Expenses]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: expenseId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Expense retrieved successfully.
        "401":
          description: Unauthorized.
        "404":
          description: Expense not found.
    put:
      summary: Update an expense
      tags: [Expenses]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: expenseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseInput'
      responses:
        "200":
          description: Expense updated successfully.
        "401":
          description: Unauthorized.
        "404":
          description: Expense not found.
    delete:
      summary: Delete expense (soft delete)
      tags: [Expenses]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: expenseId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Expense deleted successfully.
        "401":
          description: Unauthorized.
        "404":
          description: Expense not found.
