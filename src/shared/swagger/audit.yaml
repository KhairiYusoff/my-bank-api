tags:
  - name: Audit
    description: Activity log queries — own activity, user activity, and system-wide logs

paths:
  /audit/me:
    get:
      summary: Get activity logs for the logged-in user
      tags: [Audit]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: action
          schema:
            type: string
            example: LOGIN
          description: Filter by activity action type
        - in: query
          name: status
          schema:
            type: string
            enum: [SUCCESS, FAILED]
        - in: query
          name: severity
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, CRITICAL]
        - in: query
          name: startDate
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          schema:
            type: string
            format: date-time
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [createdAt, action, status, severity]
            default: createdAt
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: User activities fetched.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            action:
                              type: string
                            details:
                              type: string
                            status:
                              type: string
                              enum: [SUCCESS, FAILED]
                            severity:
                              type: string
                              enum: [LOW, MEDIUM, HIGH, CRITICAL]
                            createdAt:
                              type: string
                              format: date-time
                      meta:
                        type: object
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          total:
                            type: integer
                          pages:
                            type: integer
        "401":
          description: Unauthorized.
        "500":
          description: Server error.

  /audit/user/{userId}:
    get:
      summary: Get activity logs for a specific user (admin / banker / auditor)
      tags: [Audit]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
          description: Target user MongoDB ID
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [SUCCESS, FAILED]
        - in: query
          name: severity
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, CRITICAL]
        - in: query
          name: startDate
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          schema:
            type: string
            format: date-time
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [createdAt, action, status, severity]
            default: createdAt
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: User activities fetched.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden.
        "500":
          description: Server error.

  /audit/all:
    get:
      summary: Get all system activity logs (admin / auditor)
      tags: [Audit]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: userId
          schema:
            type: string
          description: Optional filter by user MongoDB ID
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [SUCCESS, FAILED]
        - in: query
          name: severity
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, CRITICAL]
        - in: query
          name: startDate
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          schema:
            type: string
            format: date-time
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [createdAt, action, status, severity]
            default: createdAt
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: All system activities fetched.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden.
        "500":
          description: Server error.
