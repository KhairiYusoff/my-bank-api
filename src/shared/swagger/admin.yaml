tags:
  - name: Admin
    description: Admin-only user and staff management

paths:
  /admin/create-staff:
    post:
      summary: Create a new staff member
      tags: [Admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                role:
                  type: string
                  enum: [banker, admin]
      responses:
        "201":
          description: Staff account created successfully.
        "400":
          description: Validation error or email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden.
        "500":
          description: Server error.

  /admin/staff/{staffId}:
    put:
      summary: Update staff role or status
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: staffId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [banker, admin]
                status:
                  type: string
                  enum: [active, suspended, terminated]
      responses:
        "200":
          description: Staff updated successfully.
        "400":
          description: Bad request.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden.
        "404":
          description: Staff not found.
    delete:
      summary: Delete a staff account
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: staffId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Staff deleted successfully.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden.
        "404":
          description: Staff not found.

  /admin/customer/{customerId}:
    put:
      summary: Update customer status
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: customerId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [active, suspended, terminated]
      responses:
        "200":
          description: Customer updated successfully.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden.
        "404":
          description: Customer not found.
    delete:
      summary: Delete a customer account
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: customerId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer deleted successfully.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden.
        "404":
          description: Customer not found.
